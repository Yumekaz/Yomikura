name: Upstream compatibility watch

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suwayomi:
    name: Suwayomi release drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/check-suwayomi-upstream.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: suwayomi-upstream-report
          path: suwayomi-upstream-report.md
