name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      refresh_dependencies:
        description: Resolve the reviewed dependency updates and retain lockfiles for review
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  refresh-dependencies:
    if: github.event_name == 'workflow_dispatch' && inputs.refresh_dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --lockfile-only --ignore-scripts
      - working-directory: src-tauri
        run: |
          cargo update -p zip --precise 9.0.5
          cargo update -p rustls --precise 0.23.46
          cargo update -p quinn-proto --precise 0.11.15
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-security-lockfiles
          path: |
            pnpm-lock.yaml
            src-tauri/Cargo.lock
  codeql:
    name: CodeQL (JavaScript and TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production and development dependencies
        run: pnpm audit --audit-level high
      - name: Check public helper boundaries
        run: node --test website/scripts/releases.test.mjs website/scripts/serve.test.mjs
      - run: pnpm run build
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sbom:
    name: Generate SBOM
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: yomikura-sbom.spdx.json
          artifact-name: yomikura-sbom
