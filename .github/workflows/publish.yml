name: "publish"

on:
  push:
    tags:
      - "v*"

jobs:
  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release tag and version
        run: pnpm run check:tag "${{ github.ref_name }}"
      - name: Run release verification
        run: pnpm run verify:release
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
      - name: Install browser for interaction tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Run desktop interaction tests
        run: pnpm run test:e2e

  publish-tauri:
    needs: [release-preflight, release-installer-windows]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
          - platform: "ubuntu-22.04"
          - platform: "windows-latest"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Build dual-architecture target binaries on macOS
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release version synchronization
        run: pnpm run check:version
      - name: Check release tag and version
        run: pnpm run check:tag "${{ github.ref_name }}"

      - name: Build and Publish Release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "Yomikura v__VERSION__"
          releaseBody: |
            See the assets below to download and install this version of Yomikura.

            Yomikura is an independent open-source project applying to the SignPath Foundation for free Windows code signing. Until approval and workflow confirmation, installers are unsigned.

            See the [release readiness checklist](https://github.com/Yumekaz/Yomikura/blob/main/docs/RELEASE_READINESS.md) for validation boundaries.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.platform == 'windows-latest' && '--bundles nsis' || '' }}

      - name: Create release checksums
        run: node scripts/write-artifact-checksums.mjs "src-tauri/target/release/bundle" "SHA256SUMS-${{ matrix.platform }}.txt"

      - name: Preserve platform checksums
        uses: actions/upload-artifact@v7
        with:
          name: release-checksum-${{ matrix.platform }}
          path: SHA256SUMS-${{ matrix.platform }}.txt
          if-no-files-found: error

  release-installer-windows:
    name: Release installer smoke (Windows)
    needs: release-preflight
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.1.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache pinned smoke backend
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/yomikura-smoke-deps
          key: suwayomi-smoke-v2.3.2243-821141b32e170d4a02d3cbdfed577ed8f07bd22383ff5f4132ebb5ae40e98dd5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release version synchronization
        run: pnpm run check:version
      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Install, launch, and uninstall smoke test
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1).FullName
          if (-not $installer) { throw "NSIS installer artifact was not found" }
          $userStorage = Join-Path $env:RUNNER_TEMP "yomikura-release-user-storage"
          $backendJarCache = Join-Path $env:RUNNER_TEMP "yomikura-smoke-deps\Suwayomi-Server-v2.3.2243.jar"
          ./scripts/smoke-test-installer.ps1 -InstallerPath $installer -PreservedStoragePath $userStorage -PreseedRuntime -JavaHomePath $env:JAVA_HOME -BackendJarCachePath $backendJarCache -StartupTimeoutSeconds 180
      - name: Collect installer smoke diagnostics
        if: always()
        shell: pwsh
        run: |
          $diagnostics = Join-Path $env:RUNNER_TEMP "yomikura-smoke-diagnostics"
          New-Item -ItemType Directory -Path $diagnostics -Force | Out-Null
          $userStorage = Join-Path $env:RUNNER_TEMP "yomikura-release-user-storage"
          $backendLog = Join-Path $userStorage "suwayomi.log"
          if (Test-Path -LiteralPath $backendLog) {
            Copy-Item -LiteralPath $backendLog -Destination (Join-Path $diagnostics "suwayomi.log") -Force
          }
          $sentinel = Join-Path $userStorage "smoke-sentinel.txt"
          if (Test-Path -LiteralPath $sentinel) {
            Copy-Item -LiteralPath $sentinel -Destination (Join-Path $diagnostics "smoke-sentinel.txt") -Force
          }
          $metrics = Join-Path $userStorage "smoke-metrics.json"
          if (Test-Path -LiteralPath $metrics) {
            Copy-Item -LiteralPath $metrics -Destination (Join-Path $diagnostics "smoke-metrics.json") -Force
          }
          $configDirectory = Join-Path $env:APPDATA "app.yomikura"
          $settingsFile = Join-Path $configDirectory "yomikura-settings.json"
          if (Test-Path -LiteralPath $settingsFile) {
            Copy-Item -LiteralPath $settingsFile -Destination (Join-Path $diagnostics "yomikura-settings.json") -Force
          }
          Get-Process -Name "Yomikura", "java", "javaw" -ErrorAction SilentlyContinue |
            Select-Object Id, ProcessName, CPU, StartTime, Path |
            Out-File -FilePath (Join-Path $diagnostics "processes.txt")
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Sort-Object LocalPort |
            Format-Table -AutoSize |
            Out-File -FilePath (Join-Path $diagnostics "listening-ports.txt")
      - name: Upload installer smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installer-smoke-diagnostics
          path: ${{ runner.temp }}/yomikura-smoke-diagnostics
          if-no-files-found: ignore

  release-checksums:
    name: Verify and publish release checksums
    needs: publish-tauri
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download platform checksums
        uses: actions/download-artifact@v8
        with:
          pattern: release-checksum-*
          path: checksums
          merge-multiple: true

      - name: Upload checksums and verify release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" checksums/SHA256SUMS-*.txt --clobber
          assets="$(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name')"
          for checksum in \
            "SHA256SUMS-macos-latest.txt" \
            "SHA256SUMS-ubuntu-22.04.txt" \
            "SHA256SUMS-windows-latest.txt"; do
            grep -Fx "$checksum" <<< "$assets" > /dev/null || {
              echo "Missing release checksum asset: $checksum"
              exit 1
            }
          done
          grep -E '\.(exe|dmg|AppImage|deb|rpm)$' <<< "$assets" > /dev/null || {
            echo "No platform installer artifact was found in the release"
            exit 1
          }
