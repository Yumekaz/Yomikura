name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build frontend
        run: pnpm run build

  desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Compile Tauri desktop shell
        working-directory: src-tauri
        run: cargo check

  desktop-installer-windows:
    name: Desktop installer (Windows)
    if: github.event_name == 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Install, launch, and uninstall smoke test
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1).FullName
          $installDir = Join-Path $env:RUNNER_TEMP "yomikura-smoke"
          if (Test-Path $installDir) { Remove-Item -LiteralPath $installDir -Recurse -Force }

          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)" }

          $appPath = Join-Path $installDir "Yomikura.exe"
          $uninstaller = Join-Path $installDir "uninstall.exe"
          if (-not (Test-Path $appPath)) { throw "Installed application was not found at $appPath" }
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller was not found at $uninstaller" }

          $app = Start-Process -FilePath $appPath -PassThru
          Start-Sleep -Seconds 8
          if ($app.HasExited) { throw "Yomikura exited during launch smoke test with code $($app.ExitCode)" }
          Stop-Process -Id $app.Id -Force
          $app.WaitForExit()

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)" }
          if (Test-Path $installDir) { throw "Installer directory still exists after uninstall: $installDir" }
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: yomikura-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
