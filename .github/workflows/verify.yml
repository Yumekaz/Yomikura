name: Verify

on:
  push:
    branches: [main, codex/reading-room]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      extension_migration:
        description: Verify a populated extension library against the Suwayomi hotfix
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release version synchronization
        run: pnpm run check:version
      - name: Verify release artifact manifests
        run: pnpm run test:release-artifacts
      - name: Typecheck application
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Build frontend
        run: pnpm run build
      - name: Check production bundle budget
        run: pnpm run check:bundle
      - name: Preserve GitHub-built browser preview
        uses: actions/upload-artifact@v4
        with:
          name: yomikura-web-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Install browser for interaction tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Check chapter menu focus and positioning
        run: pnpm exec playwright test tests/e2e/reading-controls.spec.ts --grep "chapter actions remain inside the viewport"
      - name: Check offline reader continuity after completion
        run: pnpm exec playwright test tests/e2e/reader-continuity.spec.ts --grep "moving backward after completion"
      - name: Desktop interaction tests
        run: pnpm run test:e2e
      - name: Preserve demo visual review screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-visual-review
          path: |
            .cache/beta-ui-review/*.png
            .cache/browser-setup-guide/*.png
            .cache/reader-release-review/*.png
            .cache/visual-upgrade-2026-10-24/screens/library-0-1440.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release version synchronization
        run: pnpm run check:version
      - name: Compile Tauri desktop shell
        working-directory: src-tauri
        run: cargo check
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt -- --check
      - name: Native unit tests
        working-directory: src-tauri
        run: cargo test --lib --locked -- --test-threads=1
      - name: Run Rust Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

  desktop-installer-windows:
    name: Desktop installer (Windows)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: installer
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache current and baseline Suwayomi JARs
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/yomikura-smoke-deps
          key: suwayomi-smoke-v2.4.2373-dd05d523cc785b7acf90c9feac0bc84c53d5fb3af5ab2a33653646e2076e5217
          restore-keys: suwayomi-smoke-v2.3.2243-821141b32e170d4a02d3cbdfed577ed8f07bd22383ff5f4132ebb5ae40e98dd5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release version synchronization
        run: pnpm run check:version
      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify installer process ownership
        shell: pwsh
        run: ./scripts/test-smoke-process-ownership.ps1
      - name: Verify production private runtime
        id: private-runtime
        shell: pwsh
        run: ./scripts/verify-private-runtime.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'yomikura-private-runtime')
      - name: Install, launch, and uninstall smoke test
        env:
          YOMIKURA_PRIVATE_JAVA: ${{ steps.private-runtime.outputs.java_home }}
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1).FullName
          if (-not $installer) { throw "NSIS installer artifact was not found" }
          $userStorage = Join-Path $env:RUNNER_TEMP "yomikura-user-storage"
          $backendJarCache = Join-Path $env:RUNNER_TEMP "yomikura-smoke-deps\Suwayomi-Server-v2.4.2373.jar"
          # Fresh Windows runners can spend several minutes scanning the
          # verified 166 MB backend JAR. Keep the wait bounded, but allow a
          # realistic clean-install margin before declaring startup broken.
          ./scripts/smoke-test-installer.ps1 -InstallerPath $installer -PreservedStoragePath $userStorage -PreseedRuntime -JavaHomePath $env:YOMIKURA_PRIVATE_JAVA -BackendJarCachePath $backendJarCache -StartupTimeoutSeconds 240
      - name: Verify library identity and Suwayomi hotfix migration
        env:
          YOMIKURA_PRIVATE_JAVA: ${{ steps.private-runtime.outputs.java_home }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $runtimeCache = Join-Path $env:RUNNER_TEMP 'yomikura-smoke-deps'
          $baselineVersion = '2.3.2243'
          $baselineName = "Suwayomi-Server-v$baselineVersion.jar"
          $backendJar = Join-Path $runtimeCache $baselineName
          $baselineDigest = '821141b32e170d4a02d3cbdfed577ed8f07bd22383ff5f4132ebb5ae40e98dd5'
          if (!(Test-Path -LiteralPath $backendJar -PathType Leaf) -or
              (Get-FileHash -LiteralPath $backendJar -Algorithm SHA256).Hash -ne $baselineDigest) {
            Invoke-WebRequest -Uri "https://github.com/Suwayomi/Suwayomi-Server/releases/download/v$baselineVersion/$baselineName" -OutFile $backendJar
          }
          if ((Get-FileHash -LiteralPath $backendJar -Algorithm SHA256).Hash -ne $baselineDigest) {
            throw 'The baseline Suwayomi JAR does not match its official digest.'
          }
          $javaBinary = Join-Path $env:YOMIKURA_PRIVATE_JAVA "bin\java.exe"
          $candidateVersion = '2.4.2373'
          $candidateName = "Suwayomi-Server-v$candidateVersion.jar"
          $candidateJar = Join-Path $runtimeCache $candidateName
          $candidateDigest = (Get-FileHash -LiteralPath $candidateJar -Algorithm SHA256).Hash
          if ($candidateDigest -ne 'dd05d523cc785b7acf90c9feac0bc84c53d5fb3af5ab2a33653646e2076e5217') {
            throw 'The Suwayomi migration candidate does not match its official digest.'
          }
          node scripts/verify-library-identity.mjs "--jar=$backendJar" "--java=$javaBinary" "--candidate-jar=$candidateJar" "--candidate-version=$candidateVersion"
      - name: Preserve live identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-identity-live-evidence
          path: .cache/library-identity-live/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: yomikura-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
      - name: Preserve the installer build's browser interface for migration
        if: inputs.extension_migration
        uses: actions/upload-artifact@v4
        with:
          name: yomikura-extension-migration-web
          path: dist/
          if-no-files-found: error
          retention-days: 7

  managed-extension-migration:
    name: Managed Suwayomi extension migration (Windows)
    if: github.event_name == 'workflow_dispatch' && inputs.extension_migration
    needs: desktop-installer-windows
    runs-on: windows-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium
      - uses: actions/download-artifact@v4
        with:
          name: yomikura-windows-installer
          path: ${{ runner.temp }}/yomikura-migration-installer
      - uses: actions/download-artifact@v4
        with:
          name: yomikura-extension-migration-web
          path: dist/
      - name: Verify production private runtime
        id: private-runtime
        shell: pwsh
        run: ./scripts/verify-private-runtime.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'yomikura-private-runtime')
      - name: Install build and enable Yomikura WebView inspection on this disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $directory = Join-Path $env:RUNNER_TEMP 'yomikura-migration-installer'
          $installers = @(Get-ChildItem -LiteralPath $directory -File -Filter '*-setup.exe')
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows installer from this run.' }
          $process = Start-Process -FilePath $installers[0].FullName -ArgumentList '/S' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Yomikura installer exited with $($process.ExitCode)." }
          $key = 'HKLM:\Software\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'
          New-Item -Path $key -Force | Out-Null
          foreach ($app in @('app.exe', 'Yomikura.exe')) {
            New-ItemProperty -Path $key -Name $app -Value '--remote-debugging-port=9237 --remote-debugging-address=127.0.0.1' -PropertyType String -Force | Out-Null
          }
      - name: Migrate installed source, server download, device copy, and reading progress
        run: node scripts/verify-extension-migration.mjs
        env:
          YOMIKURA_PRIVATE_JAVA: ${{ steps.private-runtime.outputs.java_home }}
      - name: Preserve original-fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-migration-evidence
          path: |
            .cache/extension-migration/**/*.json
            .cache/extension-migration/**/*.log
            .cache/extension-migration/**/*.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
