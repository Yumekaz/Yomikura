name: Verify

on:
  push:
    branches: [main, codex/reading-room]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release version synchronization
        run: pnpm run check:version
      - name: Verify release artifact manifests
        run: pnpm run test:release-artifacts
      - name: Typecheck application
        run: pnpm run typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Build frontend
        run: pnpm run build
      - name: Check production bundle budget
        run: pnpm run check:bundle
      - name: Preserve GitHub-built browser preview
        uses: actions/upload-artifact@v4
        with:
          name: yomikura-web-preview
          path: dist/
          if-no-files-found: error
          retention-days: 7
      - name: Install browser for interaction tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Check chapter menu focus and positioning
        run: pnpm exec playwright test tests/e2e/reading-controls.spec.ts --grep "chapter actions remain inside the viewport"
      - name: Check offline reader continuity after completion
        run: pnpm exec playwright test tests/e2e/reader-continuity.spec.ts --grep "moving backward after completion"
      - name: Desktop interaction tests
        run: pnpm run test:e2e
      - name: Preserve demo visual review screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-visual-review
          path: |
            .cache/beta-ui-review/*.png
            .cache/browser-setup-guide/*.png
            .cache/reader-release-review/*.png
            .cache/visual-upgrade-2026-10-24/screens/library-0-1440.png
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release version synchronization
        run: pnpm run check:version
      - name: Compile Tauri desktop shell
        working-directory: src-tauri
        run: cargo check
      - name: Check Rust formatting
        working-directory: src-tauri
        run: cargo fmt -- --check
      - name: Native unit tests
        working-directory: src-tauri
        run: cargo test --lib --locked -- --test-threads=1
      - name: Run Rust Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets --all-features -- -D warnings

  desktop-installer-windows:
    name: Desktop installer (Windows)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: installer
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache pinned smoke backend
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/yomikura-smoke-deps
          key: suwayomi-smoke-v2.3.2243-821141b32e170d4a02d3cbdfed577ed8f07bd22383ff5f4132ebb5ae40e98dd5
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check release version synchronization
        run: pnpm run check:version
      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify installer process ownership
        shell: pwsh
        run: ./scripts/test-smoke-process-ownership.ps1
      - name: Verify production private runtime
        id: private-runtime
        shell: pwsh
        run: ./scripts/verify-private-runtime.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'yomikura-private-runtime')
      - name: Install, launch, and uninstall smoke test
        env:
          YOMIKURA_PRIVATE_JAVA: ${{ steps.private-runtime.outputs.java_home }}
        shell: pwsh
        run: |
          $installer = (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1).FullName
          if (-not $installer) { throw "NSIS installer artifact was not found" }
          $userStorage = Join-Path $env:RUNNER_TEMP "yomikura-user-storage"
          $backendJarCache = Join-Path $env:RUNNER_TEMP "yomikura-smoke-deps\Suwayomi-Server-v2.3.2243.jar"
          # Fresh Windows runners can spend several minutes scanning the
          # verified 166 MB backend JAR. Keep the wait bounded, but allow a
          # realistic clean-install margin before declaring startup broken.
          ./scripts/smoke-test-installer.ps1 -InstallerPath $installer -PreservedStoragePath $userStorage -PreseedRuntime -JavaHomePath $env:YOMIKURA_PRIVATE_JAVA -BackendJarCachePath $backendJarCache -StartupTimeoutSeconds 240
      - name: Verify identity across two isolated local libraries
        shell: pwsh
        run: |
          $backendJar = Join-Path $env:RUNNER_TEMP "yomikura-smoke-deps\Suwayomi-Server-v2.3.2243.jar"
          $javaBinary = Join-Path $env:JAVA_HOME "bin\java.exe"
          node scripts/verify-library-identity.mjs "--jar=$backendJar" "--java=$javaBinary"
      - name: Preserve live identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: library-identity-live-evidence
          path: .cache/library-identity-live/**/*.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: yomikura-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
