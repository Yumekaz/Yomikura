query GetExtensionStores {
  extensionStores(first: 100) {
    totalCount
    nodes {
      name
      indexUrl
      isLegacy
      signingKey
      badgeLabel
      contactWebsite
      extensionListUrl
    }
  }
}

query GetExtensions {
  extensions(first: 2000) {
    totalCount
    nodes {
      pkgName
      name
      lang
      isNsfw
      isInstalled
      iconUrl
      versionName
      hasUpdate
      isObsolete
    }
  }
}
