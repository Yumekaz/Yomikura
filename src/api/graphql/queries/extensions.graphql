query GetExtensionStores {
  extensionStores(first: 100) {
    totalCount
    nodes {
      name
      indexUrl
      isLegacy
      signingKey
      badgeLabel
      contactWebsite
      contactDiscord
      extensionListUrl
    }
  }
}

query GetExtensions($first: Int = 2000, $after: Cursor) {
  extensions(first: $first, after: $after) {
    totalCount
    pageInfo { hasNextPage endCursor }
    nodes {
      pkgName
      name
      lang
      isNsfw
      isInstalled
      iconUrl
      versionName
      hasUpdate
      isObsolete
      contentWarning
      extensionStore { name indexUrl }
    }
  }
}

query GetExtensionState($pkgName: String!) {
  extension(pkgName: $pkgName) { pkgName isInstalled hasUpdate versionName }
}
