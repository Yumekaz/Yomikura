query GetMangaDetails($id: Int!) {
  manga(id: $id) {
    id
    initialized
    title
    author
    artist
    description
    thumbnailUrl
    status
    genre
    inLibrary
    categories {
      nodes { id }
    }
    source {
      name
    }
    chapters {
      nodes {
          id
          name
          chapterNumber
          sourceOrder
          isRead
          isBookmarked
          isDownloaded
          lastPageRead
          pageCount
          uploadDate
          scanlator
      }
    }
  }
}
