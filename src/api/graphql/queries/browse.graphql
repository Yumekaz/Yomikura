query GetSources($first: Int = 2000, $after: Cursor) {
  sources(first: $first, after: $after) {
    totalCount
    pageInfo { hasNextPage endCursor }
    nodes {
      id
      name
      lang
      iconUrl
      supportsLatest
      isNsfw
      isConfigurable
      extension {
        pkgName
        isInstalled
      }
    }
  }
}
