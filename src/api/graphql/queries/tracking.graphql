query GetTrackers {
  trackers {
    nodes {
      id
      name
      icon
      isLoggedIn
      isTokenExpired
      authUrl
      scores
      statuses {
        name
        value
      }
    }
  }
}

query GetMangaTrackers($mangaId: Int!) {
  trackers {
    nodes {
      id
      name
      icon
      isLoggedIn
      isTokenExpired
      supportsPrivateTracking
      authUrl
      scores
      statuses {
        name
        value
      }
    }
  }
  manga(id: $mangaId) {
    id
    title
    trackRecords {
      nodes {
        ...TrackerRecordFields
      }
    }
  }
  chapters(condition: { mangaId: $mangaId, isRead: true }, first: 1, order: [{ by: CHAPTER_NUMBER, byType: DESC }]) {
    nodes { chapterNumber }
  }
}

fragment TrackerRecordFields on TrackRecordType {
  id
  trackerId
  mangaId
  remoteId
  title
  lastChapterRead
  totalChapters
  score
  displayScore
  status
  remoteUrl
  private
}

query SearchTracker($input: SearchTrackerInput!) {
  searchTracker(input: $input) {
    trackSearches {
      id
      trackerId
      remoteId
      title
      coverUrl
      summary
      totalChapters
      lastChapterRead
      trackingUrl
      private
      publishingStatus
      publishingType
    }
  }
}

mutation BindTrackerWork($input: BindTrackInput!) {
  bindTrack(input: $input) { trackRecord { ...TrackerRecordFields } }
}

mutation RefreshTrackerRecord($input: FetchTrackInput!) {
  fetchTrack(input: $input) { trackRecord { ...TrackerRecordFields } }
}

mutation TrackProgress($input: TrackProgressInput!) {
  trackProgress(input: $input) {
    trackRecords {
      ...TrackerRecordFields
    }
  }
}

mutation UnbindTrack($input: UnbindTrackInput!) {
  unbindTrack(input: $input) {
    trackRecord {
      id
      mangaId
    }
  }
}

mutation UpdateTrack($input: UpdateTrackInput!) {
  updateTrack(input: $input) {
    trackRecord {
      ...TrackerRecordFields
    }
  }
}

mutation LogoutTracker($input: LogoutTrackerInput!) {
  logoutTracker(input: $input) {
    tracker {
      id
      isLoggedIn
    }
  }
}
