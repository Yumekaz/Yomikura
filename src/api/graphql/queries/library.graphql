query GetCategories {
  categories {
    nodes {
      id
      name
      order
    }
  }
}

query GetLibrary(
  $filter: MangaFilterInput
  $first: Int
  $after: Cursor
) {
  mangas(filter: $filter, first: $first, after: $after) {
    pageInfo {
      hasNextPage
      endCursor
    }
    nodes {
      id
      title
      thumbnailUrl
      unreadCount
      downloadCount
      status
      inLibraryAt
      sourceId
      chapters { totalCount }
      latestReadChapter { lastReadAt }
      latestFetchedChapter { fetchedAt }
      latestUploadedChapter { uploadDate }
      lastReadChapter {
        id
      }
      categories {
        nodes {
          id
        }
      }
    }
  }
}

query GetBookmarkedLibraryChapters($after: Cursor) {
  chapters(filter: { inLibrary: { equalTo: true }, isBookmarked: { equalTo: true } }, first: 200, after: $after, order: [{ by: ID, byType: ASC }]) {
    totalCount
    pageInfo { hasNextPage endCursor }
    nodes { id mangaId }
  }
}

