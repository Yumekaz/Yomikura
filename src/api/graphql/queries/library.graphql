query GetCategories {
  categories {
    nodes {
      id
      name
      order
    }
  }
}

query GetLibrary(
  $filter: MangaFilterInput
  $first: Int
) {
  mangas(filter: $filter, first: $first) {
    nodes {
      id
      title
      thumbnailUrl
      unreadCount
      downloadCount
      lastReadChapter {
        id
      }
      categories {
        nodes {
          id
        }
      }
    }
  }
}

